
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without v prefix)"
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libgl1-mesa-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install freetype fontconfig

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package plugin
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.os }}
        run: |
          set -euo pipefail

          BUILD_DIR="build/Cresizer_artefacts/Release"
          PACKAGE_DIR="package"
          mkdir -p "$PACKAGE_DIR/VST3" "$PACKAGE_DIR/Standalone" dist

          test -d "$BUILD_DIR/VST3"
          test -d "$BUILD_DIR/Standalone"

          cp -R "$BUILD_DIR/VST3/." "$PACKAGE_DIR/VST3/"
          cp -R "$BUILD_DIR/Standalone/." "$PACKAGE_DIR/Standalone/"

          ARCH="$(uname -m)"
          ARCHIVE="Cresizer-${VERSION}-${PLATFORM}-${ARCH}.zip"

          cd "$PACKAGE_DIR"
          cmake -E tar cf "../dist/$ARCHIVE" --format=zip VST3 Standalone

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cresizer-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          gh release create "$TAG" dist/*.zip \
            --title "Cresizer ${TAG}" \
            --notes "CresizerSynth ${TAG} release. Includes VST3 and Standalone builds for Linux, macOS and Windows." \
            --target "${GITHUB_SHA}"
